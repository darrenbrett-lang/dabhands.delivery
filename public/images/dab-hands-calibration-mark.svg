<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DAB Hands calibration mark">
  <!-- Outer registration marks -->
  <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
    <path d="M80 20 L80 35"/>
    <path d="M80 125 L80 140"/>
    <path d="M20 80 L35 80"/>
    <path d="M125 80 L140 80"/>
  </g>

  <!-- Centre circle and crosshair -->
  <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="80" cy="80" r="20"/>
    <path d="M80 60 L80 100"/>
    <path d="M60 80 L100 80"/>
  </g>

  <!-- Accent dots -->
  <g fill="currentColor">
    <circle cx="80" cy="30" r="2.5"/>
    <circle cx="80" cy="130" r="2.5"/>
    <circle cx="30" cy="80" r="2.5"/>
    <circle cx="130" cy="80" r="2.5"/>
  </g>
</svg>
