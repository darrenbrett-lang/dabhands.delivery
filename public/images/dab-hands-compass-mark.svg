<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dab Hands compass mark">
  <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer circle — the seal -->
    <circle cx="80" cy="80" r="32"/>

    <!-- North–South needle: concave-sided spear, longer axis -->
    <path d="M80 18 Q 86 80 80 142 Q 74 80 80 18 Z"/>

    <!-- East–West needle: concave-sided spear, shorter axis -->
    <path d="M38 80 Q 80 84 122 80 Q 80 76 38 80 Z"/>

    <!-- Intercardinal tick marks inside the circle -->
    <path d="M62 62 L68 68"/>
    <path d="M98 62 L92 68"/>
    <path d="M62 98 L68 92"/>
    <path d="M98 98 L92 92"/>
  </g>

  <!-- Centre accent -->
  <g fill="currentColor">
    <circle cx="80" cy="80" r="2"/>
  </g>
</svg>
